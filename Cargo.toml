[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/source",
    "crates/audio",
    "src-tauri",
]

[workspace.package]
version = "1.0.5"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "fs", "io-util"] }
url = "2"
tracing = "0.1"
edmc-core = { path = "crates/core" }
edmc-source = { path = "crates/source" }
edmc-audio = { path = "crates/audio" }
